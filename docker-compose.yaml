services:
  postgres:
    image: postgres:latest
    container_name: lang_studio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - langstudio_postgres_data:/var/lib/postgresql/18/docker

volumes:
  langstudio_postgres_data:
